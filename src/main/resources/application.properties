# Nombre de la aplicación
spring.application.name=futbol-liga

# Configuración de Base de Datos - SQL Server
# Ajustaremos el puerto, host, usuario y contraseña según tu entorno local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LigaFutbolDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=jeanfranco20
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
